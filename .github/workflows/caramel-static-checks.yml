name: Caramel static repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    name: Offline repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run deterministic checker
        run: python3 scripts/check_caramel_repo.py --json
